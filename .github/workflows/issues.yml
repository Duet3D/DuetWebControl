name: Auto-close blank templates
on:
  issues:
    types: [opened]
jobs:
  add-comment:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Check user permission
        id: check
        uses: actions-cool/check-user-permission@v2.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          require: write
      - if: steps.check.outputs.require-result == 'false' && contains(github.event.issue.labels.*.name, 'bug') == false && contains(github.event.issue.labels.*.name, 'enhancement') == false
        name: Close Issue
        uses: peter-evans/close-issue@v3.0.2
        with:
          comment: |
            This issue has been automatically closed because it does not originate from a Duet3D administrator.
            Please create a discussion on https://forum.duet3d.com first and fill out the corresponding GitHub template if the bug or feature request is acknowledged.
